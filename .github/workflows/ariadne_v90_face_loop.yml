name: Ariadne V90 face-first 2D loop A/B and real GLB preflight
on:
  push:
    branches:
      - ariadne_v90_face_2d_loop
    paths:
      - 'ariadne_v90/**'
      - '.github/workflows/ariadne_v90_face_loop.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  face-2d-loop-ab-and-source-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'PyYAML>=6,<7' 'pytest>=8,<10'
      - name: Restore exact original V89 YAML; historical artwork stays uncommitted
        run: |
          mkdir -p ariadne_v90/baseline
          cp ariadne_v89_ab/NEMA_Ariadne_V89_AB_Optimized_Master.yaml ariadne_v90/baseline/V89_MASTER.yaml
          echo '4cc6721e46bfbd15394e2c92bdb24272561bc809dd9fc4c175f5bc1a2c79c3cc  ariadne_v90/baseline/V89_MASTER.yaml' | sha256sum -c -
          echo 'Historical V20 art is in the separately delivered full local archive; not promoted to public GitHub source.'
      - name: Download SHA256-pinned real V87.1 engineering GLB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 45062111861 --repo "$GITHUB_REPOSITORY" \
            --name Ariadne-V87-Actual-DesignFirst-Engineering-NOT-ART --dir /tmp/ariadne-v90-base
          cp /tmp/ariadne-v90-base/Ariadne_V87_DesignFirst_Engineering_NOT_ART.glb ariadne_v90/baseline/V89_source_V87_1.glb
          echo '4e9eb8ca64891ed63aae2a7a32297bf60f9b757f9c1873a7d67480827d11c948  ariadne_v90/baseline/V89_source_V87_1.glb' | sha256sum -c -
      - name: Independently verify real GLB rig and morph capability; block absent art
        run: |
          python - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('ariadne_v90/baseline/V89_source_V87_1.glb')
          blob=p.read_bytes();n=struct.unpack_from('<I',blob,12)[0]
          gltf=json.loads(blob[20:20+n])
          count=sum(len(pr.get('targets',[])) for m in gltf.get('meshes',[]) for pr in m.get('primitives',[]))
          out={'status':'BLOCKED_REAL_FACE_AND_ART_INPUTS',
               'source_model_skins':len(gltf.get('skins',[])),
               'source_model_morph_targets':count,
               'independent_v20_face_art_present_in_this_runner':False,
               'actual_face_reconstruction_executed':False,
               'actual_neck_head_turn_executed':False,
               'reason':'Real V87.1 base is unrigged and has no face morph targets; V20 image not committed in this test-only branch'}
          assert out['source_model_skins']==0 and count==0
          Path('ariadne_v90/report/V90_preflight.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Run numerical A/B 2D front-first algorithm test
        run: python ariadne_v90/src/ab_synthetic.py > /tmp/face-ab.json
      - name: Run source-independent code tests; historical 2D asset tests run in full local package
        run: |
          python -m pytest -q ariadne_v90/tests/test_face_2d_loop.py \
            -k 'not v20_actual and not real_gltf_preflight and not v20_24'
      - name: Verify no simulated result is called real art
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('ariadne_v90/report')
          a=json.loads((r/'V90_preflight.json').read_text())
          b=json.loads((r/'face2d_AB_numeric.json').read_text())
          assert a['status']=='BLOCKED_REAL_FACE_AND_ART_INPUTS' and a['source_model_skins']==0
          assert b['B_beats_A_on_toy_data'] and b['B_fit_rounds']>=2
          assert b['real_24_view_art_approval'] is False
          print('PASS: synthetic algorithm reproducible. Actual face and head pose remain BLOCKED.')
          PY
      - name: Upload engineering A/B and blocker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ariadne-V90-FaceLoop-AB-Engineering-Evidence-Not-Art
          path: |
            ariadne_v90/report/face2d_AB_numeric.json
            ariadne_v90/report/V90_preflight.json
          retention-days: 14
          if-no-files-found: warn