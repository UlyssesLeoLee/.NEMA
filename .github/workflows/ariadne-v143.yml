name: Ariadne V143 official CC0 rigged sculpture export
on:
  push:
    branches: [feature/ariadne-v143-official-rig-pose]
    paths: ['art/ariadne/v143/**', '.github/workflows/ariadne-v143.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headless and real glTF rigging requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1 libopengl0 libxrender1 libxext6 libsm6
          python3 -m py_compile art/ariadne/v143/build_rigged.py art/ariadne/v143/verify.py
      - name: Model official MakeHuman CC0 rig and render real GLB
        run: |
          blender -b -t 2 --python-exit-code 1 --python art/ariadne/v143/build_rigged.py
      - name: Audit source weights, GLB and 10 Blender views
        run: |
          python3 art/ariadne/v143/verify.py
      - name: Upload engineering candidate and true Blender screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ariadne-V143-REAL-CC0-Rigged-GLB-10views-NOT-ART-APPROVED
          path: artifacts/ariadne_v143/
          if-no-files-found: warn
          retention-days: 14
