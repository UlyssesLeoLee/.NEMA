name: Ariadne V122 Real MakeHuman Official Skin Palm-Up Full Sculpture
on:
  push:
    branches: [ariadne-v122-official-palmup-20261124]
    paths:
      - 'ariadne_v122/**'
      - '.github/workflows/ariadne-v122-official.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-skin-anatomy-palm-up-garment:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Recover official MakeHuman CC0 skeleton weights female body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ariadne_v122/input
          gh run download 45160529755 --repo "$GITHUB_REPOSITORY" \
            --name Ariadne-V104-Official-MakeHuman-CC0-Rig-Weights \
            --dir /tmp/ariadne_official_cc0
          for FILE in base.obj caucasian-female-young.target default.mhskel default_weights.mhw; do
            ORIGIN=$(find /tmp/ariadne_official_cc0 -type f -name "$FILE" | head -1)
            test -n "$ORIGIN"
            cp "$ORIGIN" "ariadne_v122/input/$FILE"
            test -s "ariadne_v122/input/$FILE"
          done
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('ariadne_v122/input')
          sk=json.loads((root/'default.mhskel').read_text())
          w=json.loads((root/'default_weights.mhw').read_text())
          assert sk['license']==w['license']=='CC0'
          assert len(sk['bones'])==163 and len(w['weights'])>=139
          print('OFFICIAL_SOURCE_PROVENANCE',json.dumps({
            n:hashlib.sha256((root/n).read_bytes()).hexdigest()
            for n in ['base.obj','caucasian-female-young.target','default.mhskel','default_weights.mhw']}))
          PY
      - name: Install headless Blender 5 official anatomical sculpt environment
        run: |
          set -euo pipefail
          timeout 100s sudo apt-get install -y -qq blender python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0 || {
            echo 'APT_CACHE_INSTALL_MISSED_RETRY_UPDATE'
            timeout 100s sudo apt-get update -qq
            timeout 100s sudo apt-get install -y -qq blender python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0
          }
          blender --version | head -1 | grep -E '^Blender (4\.|5\.|6\.)'
      - name: Rebuild official MakeHuman rig, palm-up hand, costume and actual GLB
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python-exit-code 1 \
            --python ariadne_v122/src/build_official.py > ariadne_v122_build.log 2>&1 || {
              tail -150 ariadne_v122_build.log
              exit 1
            }
          tail -65 ariadne_v122_build.log
      - name: Validate actual rebuilt source and real reimported GLB
        run: |
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('ariadne_v122/output')
          a=json.loads((out/'V122_P0_ANATOMY_AND_GARMENT_QA.json').read_text())
          assert a['official_bones']==163 and a['original_body_vertices']==13380
          assert a['original_body_faces']==13378 and a['official_weights'] is True
          assert a['all_30_left_right_finger_segment_weights_nonzero'] is True
          assert a['left_palm_up_dot']>=.82
          assert a['forearm_mesh_edge_quality']['p02_edge_ratio']>=.65
          assert a['forearm_mesh_edge_quality']['p98_edge_ratio']<=1.6
          assert a['waist_layer_attach_max_offset_mm']<=30
          assert len(list(out.glob('V122_Actual_GLB_???.png')))==24
          assert (out/'Ariadne_V122_OfficialPalmUp_FullCandidate_NOT_ART_APPROVED.glb').stat().st_size>350000
          assert a['actual_reimported_camera_views']==24
          assert a['art_approved'] is False
          print('V122_OFFICIAL_RIG_LEFT_PALM_UP_SEWN_WAIST_ENGINEERING_PASSED_ART_BLOCKED')
          PY
      - name: Archive actual complete GLB editable rig 24 views and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ariadne-V122-OfficialCC0-Full-PalmUp-24Views-NOT-ART
          path: |
            ariadne_v122/output/**
            ariadne_v122_build.log
          retention-days: 30
          if-no-files-found: warn
