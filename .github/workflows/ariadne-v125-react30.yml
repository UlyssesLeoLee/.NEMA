name: Ariadne V125 - Thirty Real ReAct Top 2D Hand Refinement Cycles
on:
  push:
    branches: [ariadne-v125-react30-top2d-20261124]
    paths:
      - 'ariadne_v125/**'
      - '.github/workflows/ariadne-v125-react30.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-skin-anatomy-palm-up-garment:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Recover official MakeHuman CC0 skeleton weights female body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ariadne_v125/input
          gh run download 45160529755 --repo "$GITHUB_REPOSITORY" \
            --name Ariadne-V104-Official-MakeHuman-CC0-Rig-Weights \
            --dir /tmp/ariadne_official_cc0
          for FILE in base.obj caucasian-female-young.target default.mhskel default_weights.mhw; do
            ORIGIN=$(find /tmp/ariadne_official_cc0 -type f -name "$FILE" | head -1)
            test -n "$ORIGIN"
            cp "$ORIGIN" "ariadne_v125/input/$FILE"
            test -s "ariadne_v125/input/$FILE"
          done
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('ariadne_v125/input')
          sk=json.loads((root/'default.mhskel').read_text())
          w=json.loads((root/'default_weights.mhw').read_text())
          assert sk['license']==w['license']=='CC0'
          assert len(sk['bones'])==163 and len(w['weights'])>=139
          print('OFFICIAL_SOURCE_PROVENANCE',json.dumps({
            n:hashlib.sha256((root/n).read_bytes()).hexdigest()
            for n in ['base.obj','caucasian-female-young.target','default.mhskel','default_weights.mhw']}))
          PY
      - name: Retrieve official pinned Blender 4.5 binary (no apt mirror dependency)
        run: |
          set -euo pipefail
          URL="https://mirror.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          FALLBACK="https://mirror.clarkson.edu/blender/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          curl --fail --location --retry 1 --retry-delay 2 \
               --connect-timeout 20 --max-time 210 "$URL" -o "$RUNNER_TEMP/blender.tar.xz" || \
          curl --fail --location --retry 1 --retry-delay 2 \
               --connect-timeout 20 --max-time 210 "$FALLBACK" -o "$RUNNER_TEMP/blender.tar.xz"
          test "$(stat -c%s "$RUNNER_TEMP/blender.tar.xz")" -gt 350000000
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BINARY="$RUNNER_TEMP/blender-4.5.13-linux-x64"
          test -x "$BINARY/blender"
          "$BINARY/blender" --version | head -1
          echo "$BINARY" >> "$GITHUB_PATH"
      - name: Rebuild official MakeHuman rig, palm-up hand, costume and actual GLB
        run: |
          set -euo pipefail
          ARIADNE_RENDER_BACKEND=EXTERNAL_VTK blender -b -t 2 --python-exit-code 1 \
            --python ariadne_v125/src/build_v125_react.py > ariadne_v125_build.log 2>&1 || {
              tail -150 ariadne_v125_build.log
              exit 1
            }
          tail -65 ariadne_v125_build.log
      - name: Validate actual rebuilt source and real reimported GLB
        run: |
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('ariadne_v125/output')
          a=json.loads((out/'V125_P0_ANATOMY_AND_GARMENT_QA.json').read_text())
          assert a['official_bones']==163 and a['original_body_vertices']==13380
          assert a['original_body_faces']==13378 and a['official_weights'] is True
          assert a['all_30_left_right_finger_segment_weights_nonzero'] is True
          assert a['left_palm_up_dot']>=.82
          assert 'forearm_zero_severe_gate' in a and 'right_hand_gesture_changed_from_neutral' in a
          assert 'digit_pad_per_bone_measurements' in a['contact']
          assert 'top2d_palmar_surface_classification' in a
          assert 'palmar_not_dorsal_support_engineering_gate' in a
          assert 'palm_cross_product_flipped_from_V123' in a
          assert a['palmar_not_dorsal_support_engineering_gate'] is True
          assert a['top2d_palmar_surface_classification']['positive_fraction']>=.70
          assert a['top2d_actual_geometry_alignment']['rotation_determinant']>.99
          assert a['top2d_actual_geometry_alignment']['authored_2d_vs_actual_3d_rms_px']>0
          assert a['top2d_actual_geometry_alignment']['top_art_authority_approved'] is False
          assert (out/'V125_TOP2D_CALIBRATION_LANDMARKS.json').exists()
          assert a['waist_layer_attach_max_offset_mm']<=30
          assert a['render_backend']=='EXTERNAL_VTK_INDEPENDENT_ACTUAL_GLTF'
          assert a['actual_reimported_camera_views']==0
          assert (out/'Ariadne_V125_OfficialPalmUp_FullCandidate_NOT_ART_APPROVED.glb').stat().st_size>350000
          assert a['reimport_mesh_count']>18 and a['P0_palm_up_gate']=='PASS'
          assert a['P0_forearm_edge_p02_gate'] in ('PASS','FAIL')
          assert a['P0_waist_attached_geometry_gate'] in ('PASS','FAIL')
          assert a['react_top2d_30_executed']==30
          assert 0<=a['react_top2d_30_accepted_rounds']<=30
          assert a['react_top2d_rms_after_px']<=a['react_top2d_rms_before_px']
          assert a['react_top2d_actual_skinned_contact']['palmar_visible_from_top'] is True
          react=json.loads((out/'V125_REACT30_TOP2D_ITERATION_LOG.json').read_text())
          assert len(react['rounds'])==30
          assert [r['round'] for r in react['rounds']]==list(range(1,31))
          assert all(r['2d_authority_user_approved'] is False for r in react['rounds'])
          assert (out/'V125_REACT30_2D_ANCHORS_COMPARISON.json').exists()
          assert a['art_approved'] is False
          print('V125_ENGINEERING_BUILD_DONE; ANATOMY/CONTACT/ART GATES REPORTED SEPARATELY')
          PY
      - name: Archive actual complete GLB editable rig 24 views and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ariadne-V125-30RealReAct-Top2D-OfficialCC0-NOT-ART
          path: |
            ariadne_v125/output/**
            ariadne_v125/src/build_v125_react.py
            ariadne_v125/src/react_top2d_30.py
            ariadne_v125/art/**
            .github/workflows/ariadne-v125-top2d.yml
            ariadne_v125_build.log
          retention-days: 30
          if-no-files-found: warn
