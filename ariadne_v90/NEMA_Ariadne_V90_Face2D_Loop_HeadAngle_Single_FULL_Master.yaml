ab_result_interpretation:
  engineering_pilot:
    measured_from_real_v87_1_body: true
    metrics_source: report/AB_Results.json
    note: 'A 与 B 的球面间距只测量现有未重摆姿态的右侧手部“空间候选区域”， 不是掌面/指腹语义点，不能证明托球动作正确。

      '
  artistic_quality:
    benchmark_status: NOT_RUN_ON_TWO_POSED_GLBS
    winner: UNDETERMINED
    reason: '当前 GLB 没有可用骨架，且 B 方案没有产出新的可验收 3D 姿态和 24 视角渲染。 正式 A/B 的结果必须等待实际两个独立的 pose+ball+thread GLB 和独立相机配准。

      '
  chosen_specification: B
  chosen_specification_reason: 'B 在当前真实输入的能力识别、接触候选定位、导出完整性以及错误放行防护上更可执行， 但尚不具备证明艺术品质优于 A 的证据。

    '
  V90_face_added:
    method_selected: B_FACE_IDENTITY_EXPRESSIONS_2D_LOOP_THEN_NECK_ROTATION
    isolated_numeric_ab_status: SYNTHETIC_TEST_ONLY
    actual_v20_blender_face_loop_status: BLOCKED_MISSING_FACE_LANDMARKS_MORPHS_RIG
    actual_head_angle_status: NOT_EXECUTED
    final_art_approval: NOT_APPROVED
face_2d_loop_contract:
  core_principle: FACE_IDENTITY_IN_2D_FIRST_THEN_EXPRESSION_THEN_HEAD_ANGLE
  two_separate_phases:
    L1_identity_geometry:
      target: frontal facial bone structure and timeless likeness
      regions:
      - eye_spacing
      - eye_shape
      - nose_bridge_and_tip
      - cheekbone_projection
      - jawline
      - chin
      - facial_proportion
      allowed_edits:
      - verified_anatomical_shape_keys
      - face_vertex_sculpt_deltas_registered_to_3D_IDs
      disallowed:
      - camera_pose_to_hide_face_errors
      - 2D_plane_with_face_texture
      - mirror_away_genuine_asymmetry
      lock_when:
      - original_art_landmarks_registered
      - actual_frontal_Blender_render_checked
      - identity_shape_approved
    L2_expression_geometry:
      target: subtle original V20 composed expression; no invented smile or gaze change
      regions:
      - upper_and_lower_eyelids
      - brow_arch_left_right
      - lip_crease
      - mouth_corner_left_right
      - nasolabial_and_chin_tension
      - gaze_direction
      allowed_edits:
      - approved_expression_shape_keys
      - localized_sculpt_delta_matching_independent_2d
      disallowed:
      - over_exaggerated_smile
      - eyes_closed_when_reference_eyes_open
      - texture_only_lip_crease
      lock_when:
      - expression_2d_art_approved
      - microexpression_visible_in_geometry
      - actual_same_camera_face_render_checked
  loop:
    max_iterations_each_phase: 30
    must_run_in_real_Blender_on_real_3D_face: true
    process:
    - render_actual_neutral_front_same_camera
    - register_2D_art_to_render_geometry
    - measure_per_region_silhouette_and_landmarks
    - choose_worst_semantic_region
    - edit_3D_anatomical_basis_with_bounded_delta
    - rerender_same_camera
    - regression_check_3D_face_volume_and_other_angles
    - rollback_if_any_critical_region_degrades
    objective: weighted_robust_per_region_pixel_landmark_loss_plus_geometry_prior_plus_expression_prior
    normalization: use_same_camera_intrinsics_extrinsics_and_registration_for_every_iteration
    early_stop_only_when:
    - region_metrics_plateau_with_art_minima_satisfied
    - human_identity_and_expression_signoff
    if_no_improvement: ROLLBACK_AND_LOG_NEXT_REGION_OR_BLOCK
    never_treat_max_iteration_count_as_success: true
    max_shape_key_step_per_iteration: 0.12
    max_face_shape_coeff_in_unit_interval: 1.0
    retain_approved_asymmetry: true
    do_not_use_mean_face_loss_to_hide_failed_eye_or_mouth: true
  art_quality_gate:
    front_identity_expressions_separately_approved: true
    reprojection_error_percentile_95_max_px: MUST_BE_SET_FROM_CALIBRATED_SOURCE
    independent_v20_face_2d_source: true
    actual_face_model_render: true
    nose_lips_eyelids_true_geometry: true
    front_face_mesh_locked_before_head_turn: true
    status: BLOCKED_PENDING_REAL_FACE_SCULPT_AND_HUMAN_APPROVAL
