    elevation_deg: [-75,-60,-45,-30,-15,0,15,30,45,60,75]
    azimuth_step_deg: 15
    poles: [-90,90]
    unique_views: 266
    react_rounds: 30
  horizontal:
    unique_views: 360
    rounds_per_view: 5
  local_rounds_per_region: 30
  require_independent_art_before_counting_react: true
  no_self_certification: true
repairs:
  hair: actual_fine_geometry_following_existing_locks
  eyes: verified_iris_and_recessed_pupil_geometry_required
  palm: actual_mesh_contact_between_wrist_and_knuckles
