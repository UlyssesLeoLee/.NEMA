<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEMA</title>
<!--
  The site's own 404 page, served for any path under this site root that does
  not resolve to a file.

  Note on the case of the site path. GitHub Pages resolves the *site prefix*
  case-sensitively at the user-site level, before a request ever reaches this
  site root. A request for /.nema/ therefore never loads this file - GitHub
  answers "Site not found" on its own. Measured against the live site on
  2026-11-07: /.nema/ -> GitHub "Site not found", while
  /.NEMA/definitely-missing-page -> this page. So a lower-case alias for the
  site root cannot be implemented from here; it has to live in the hosting
  configuration instead.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #0b0d12; color: #e8e6e1;
    font: 16px/1.6 "Iowan Old Style", "Songti SC", Georgia, serif;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: .08em; font-weight: 500; }
  .mark { color: #c9a227; letter-spacing: .3em; font-size: 13px; }
  a { color: #c9a227; }
  p { margin: 0; color: #9b968c; }
</style>
</head>
<body>
<p class="mark">· N · E · M · A ·</p>
<h1>NEMA</h1>
<p>这里没有这一页。</p>
<p><a id="home" href="https://ulyssesleolee.github.io/.NEMA/website/index.html">返回首页</a></p>
<script>
  document.getElementById('home').href = /(^|\.)github\.io$/i.test(window.location.hostname)
    ? '/.NEMA/website/index.html'
    : '/website/index.html';
</script>
</body>
</html>
